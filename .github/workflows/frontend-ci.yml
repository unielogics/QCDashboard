name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Compile-only public placeholders; CI never connects to the live API.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_CAPITAL_APP_URL: http://127.0.0.1:9
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run financing and catalog helper tests
        run: >-
          pnpm exec vitest run
          src/lib/__tests__/marketplaceIssues.test.ts
          src/lib/__tests__/marketplacePreparation.test.ts
          src/lib/__tests__/marketplacePublication.test.ts
          src/lib/__tests__/investorEconomics.test.ts
          src/lib/__tests__/loanDates.test.ts
          src/lib/__tests__/loanTermsSync.test.ts
          src/lib/__tests__/termsSaveIntent.test.ts
          src/lib/__tests__/currentUserIdentity.test.ts
          src/lib/__tests__/marketplacePpm.test.ts
          src/lib/__tests__/marketplacePpmPresets.test.ts
          src/lib/__tests__/fileWorkspace.test.ts
          src/lib/__tests__/marketplaceDocumentVersions.test.ts
          src/lib/__tests__/chatgptProductFeed.test.ts
          src/components/__tests__/ChatgptProductFeed.test.ts
          src/lib/__tests__/investorReturnModel.test.ts
          src/lib/__tests__/operatingPlan.test.ts
          src/lib/__tests__/operatingGuidance.test.ts
          src/lib/__tests__/operatingCoverage.test.ts
          src/lib/__tests__/operatingSourceDraft.test.ts
          src/lib/__tests__/operatingUnitPlanning.test.ts
          src/lib/__tests__/operatingStep3.test.ts
          src/lib/__tests__/recognizablePlan.test.ts
          src/components/application/__tests__/OperatingPlanChanges.test.ts
          src/components/application/__tests__/OperatingPlanGuide.test.ts
          src/components/application/__tests__/OperatingPlanForm.test.ts
          src/components/application/__tests__/StaffOperatingSources.test.ts
          src/components/file/cockpit/__tests__/OperatingPlanEntry.test.ts

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit --pretty false

      - name: Lint changed scope
        run: >-
          pnpm exec eslint
          'src/app/admin/marketplace/[id]/page.tsx'
          'src/app/files/[id]/page.tsx'
          src/components/marketplace/MarketplacePublishStrip.tsx
          src/components/marketplace/MarketplaceIssues.tsx
          src/lib/marketplaceIssues.ts
          src/lib/marketplaceGuidanceFocus.ts
          src/hooks/useCapitalPartners.ts
          src/components/file/LeadDetailPanel.tsx
          src/components/file/cockpit/FinancialCockpit.tsx
          src/components/file/cockpit/CoverageCard.tsx
          src/components/application/ApplicationProgramReadiness.tsx
          src/lib/__tests__/marketplaceIssues.test.ts
          tests/marketplace-error-guidance.spec.ts
          tests/fixtures/marketplaceErrorGuidance.ts
          tests/marketplace-owner-destination.spec.ts
          src/components/file/DealBudgetSection.tsx
          src/components/file/CompanyFeeControls.tsx
          src/components/file/InvestorEconomicsPanel.tsx
          src/components/marketplace/MarketplaceFileInventory.tsx
          src/components/marketplace/MarketplaceDocumentGrants.tsx
          src/hooks/useMarketplaceDocumentLink.ts
          src/lib/dealBudget.ts
          src/lib/investorEconomics.ts
          src/lib/marketplaceFileDocuments.ts
          src/lib/loanDates.ts
          src/lib/loanTermsSync.ts
          src/components/application/LoanDateFields.tsx
          src/components/application/ApplicationClientTermsPanel.tsx
          src/production-package/TermSheetDrawer.tsx
          src/lib/__tests__/investorEconomics.test.ts
